# Configuración del visualizador en vivo.
# Todo es opcional: lo que no pongas toma el valor por defecto de visualizer/config.py

audio:
  sample_rate: 44100
  device: null          # null = dispositivo por defecto. Usa `python live.py --list-devices`
  channels: 1           # canales a capturar del dispositivo
  # Modo multicanal: un instrumento por canal de tu interfaz de audio.
  # Cada uno se analiza por separado y se envía como /ch/<nombre>/...
  # inputs:
  #   - {channel: 1, name: guitarra}
  #   - {channel: 2, name: voz}
  #   - {channel: 3, name: bateria}

osc:
  host: 127.0.0.1
  port: 7000
  prefix: ""            # ej. "/av" para que todo salga como /av/drums/kick
  send_fps: 60          # mensajes por segundo hacia TouchDesigner

analysis:
  hop_size: 512         # ~11.6 ms a 44.1 kHz (menos = menos latencia, más CPU)
  window_size: 2048
  hpss_kernel: 17
  attack: 0.01          # segundos de subida del suavizado
  release: 0.15         # segundos de caída del suavizado
  autogain_seconds: 8   # cuánto tarda en "olvidar" un pico de volumen
  onset_sensitivity: 1.5

bands:
  - {name: sub,     low: 20,   high: 60}
  - {name: bass,    low: 60,   high: 250}
  - {name: lowmid,  low: 250,  high: 500}
  - {name: mid,     low: 500,  high: 2000}
  - {name: highmid, low: 2000, high: 4000}
  - {name: high,    low: 4000, high: 16000}

# Detectores aproximados. "percussive" = golpes (pulso 0..1 + nivel),
# "harmonic" = sonido sostenido (nivel 0..1).
# Bombo, caja y hi-hat usan los detectores calibrados de drum_model.json (ver tools/bench);
# sensitivity/min_flux/combine sólo se usan si ese archivo no está. ranges define el nivel (_level).
# min_flux: umbral mínimo absoluto del golpe (súbelo si hay falsos golpes con ruido de fondo).
# combine: all = todas las zonas de frecuencia deben golpear a la vez.
instruments:
  drums/kick:  {type: percussive, ranges: [[40, 120]],               sensitivity: 1.5, refractory: 0.10}
  drums/snare: {type: percussive, ranges: [[150, 400], [2000, 6000]], combine: all, sensitivity: 1.5, refractory: 0.08}
  drums/hihat: {type: percussive, ranges: [[7000, 16000]],            sensitivity: 1.3, refractory: 0.05, pulse_release: 0.08}
  bass:        {type: harmonic,   ranges: [[40, 250]]}
  lead:        {type: harmonic,   ranges: [[250, 4000]]}

pitch:
  min_hz: 150        # rango de la melodía (debajo está el bajo)
  max_hz: 1500
  harmonics: 8
  min_confidence: 0.3
  background_subtract: 0.9   # resta lo que viene sonando (acordes) para resaltar la melodía
  background_seconds: 1.0

tempo:
  min_bpm: 70
  max_bpm: 180
  initial_bpm: 120
  history_seconds: 6
  update_seconds: 0.5
