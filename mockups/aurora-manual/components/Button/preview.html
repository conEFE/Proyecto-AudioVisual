<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-3); padding: var(--space-4); align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: var(--space-1-5); padding: var(--space-2) var(--space-3); border: 0; border-radius: var(--radius-sm); font: inherit; font-size: 12px; line-height: 16px; cursor: pointer; }
  .pri { background: var(--primary); color: var(--primary-foreground); font-weight: 600; }
  .sec { background: var(--secondary); color: var(--foreground); font-weight: 500; }
  .pri:disabled { background: var(--muted); color: var(--muted-foreground); cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
</style>
</head>
<body>
<div class="row">
  <button type="button" class="btn pri">Tomar caso para revisión</button>
  <button type="button" class="btn sec">
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
    Actualizar
  </button>
  <button type="button" class="btn pri" disabled>Registrar revisión y cerrar caso</button>
</div>
</body>
</html>
