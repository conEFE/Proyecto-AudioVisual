<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aurora · Header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#09090b}
a{color:#a78bfa}a:hover{color:#c4b5fd}
</style>
</helmet>
<header style="background: #0e0e12; border-bottom: 1px solid #27272a; color: #fafafa; font-family: Inter, system-ui, sans-serif;">
  <div style="max-width: 1280px; margin: 0 auto; padding: 0 32px; box-sizing: border-box;">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 52px; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
        <div style="width: 32px; height: 32px; border-radius: 8px; background: #7c3aed; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
        </div>
        <div style="min-width: 0;">
          <p style="margin: 0; font-size: 14px; font-weight: 600; line-height: 1.2;">Proyecto Aurora</p>
          <p style="margin: 0; font-size: 11px; color: #a1a1aa;">{{userLine}}</p>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 4px;">
        <sc-if value="{{isMedico}}" hint-placeholder-val="{{true}}">
          <button type="button" aria-label="Notificaciones (2 sin leer)" style="position: relative; width: 44px; height: 44px; background: transparent; border: 0; color: #a1a1aa; display: flex; align-items: center; justify-content: center;">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
            <span style="position: absolute; top: 8px; right: 8px; min-width: 16px; height: 16px; border-radius: 8px; background: #dc2626; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</span>
          </button>
        </sc-if>
        <a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px; font-size: 13px; color: #a1a1aa; text-decoration: none;">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
          Salir
        </a>
      </div>
    </div>
    <nav aria-label="Secciones" style="display: flex; gap: 4px; padding-bottom: 6px; overflow-x: auto;">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
        <a href="{{item.href}}" style="{{item.style}}">{{item.label}}</a>
      </sc-for>
    </nav>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","queue","cases","upload","dashboard","config","panel"],"default":"home"},"role":{"editor":"enum","options":["MEDICO","ADMINISTRATIVO","ADMIN"],"default":"MEDICO"},"$preview":{"width":1280,"height":96}}'>
class Component extends DCLogic {
renderVals() {
  const active = this.props.active ?? 'home';
  const role = this.props.role ?? 'MEDICO';
  const C = ['MEDICO', 'ADMINISTRATIVO'];
  const all = [
    { id: 'home', label: 'Inicio', href: 'Home.dc.html', roles: C },
    { id: 'queue', label: 'Cola de triage', href: 'Cola.dc.html', roles: C },
    { id: 'cases', label: 'Casos', href: 'Casos.dc.html', roles: C },
    { id: 'upload', label: 'Imágenes', href: 'Imagenes.dc.html', roles: C },
    { id: 'dashboard', label: 'Dashboard', href: 'Dashboard.dc.html', roles: ['MEDICO', 'ADMINISTRATIVO', 'ADMIN'] },
    { id: 'config', label: 'Parámetros', href: 'Parametros.dc.html', roles: ['MEDICO', 'ADMIN'] },
    { id: 'panel', label: 'Administración', href: 'AdminUsuarios.dc.html', roles: ['ADMIN'] }
  ];
  const base = 'display: flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; text-decoration: none;';
  const items = all.filter((i) => i.roles.includes(role)).map((i) => ({
    ...i,
    style: base + (i.id === active ? ' background: #7c3aed; color: #ffffff;' : ' color: #a1a1aa;')
  }));
  const names = { MEDICO: 'Dra. [Nombre Apellido] · Médico', ADMINISTRATIVO: '[Nombre Apellido] · Administrativo', ADMIN: '[Nombre Apellido] · Administrador' };
  return { items, isMedico: role === 'MEDICO', userLine: names[role] };
}
}
</script>
</body>
</html>
