<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Wireframe · Cola de triage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#333}a:hover{color:#000}
.wf{width:1280px;height:800px;box-sizing:border-box;background:#fafaf7;color:#333;font-family:Kalam,cursive;display:flex;flex-direction:column;overflow:hidden}
.top{height:56px;flex-shrink:0;border-bottom:2px solid #333;display:flex;align-items:center;gap:12px;padding:0 28px}
.logo{width:30px;height:30px;border:2px solid #333;border-radius:6px}
.nav{display:flex;gap:8px;padding:10px 28px;border-bottom:2px dashed #999;flex-shrink:0}
.tab{padding:2px 14px;border:2px solid #333;border-radius:6px;font-size:16px;text-decoration:none}
.on{background:#333;color:#fafaf7}
.body{flex:1;padding:24px 28px;display:flex;flex-direction:column;gap:16px;min-height:0}
.box{border:2px solid #333;border-radius:8px;padding:14px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.ln{height:10px;background:#ccc;border-radius:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;border:2px solid #333;border-radius:6px;font-size:16px;background:transparent;font-family:inherit;color:inherit;text-decoration:none}
.chip{display:inline-block;padding:0 10px;border:2px solid #333;border-radius:12px;font-size:14px}
.tr{display:grid;grid-template-columns:40px 1.4fr 1fr 1fr 1fr 1fr 1.4fr 80px;gap:12px;align-items:center;padding:10px 14px;border-top:2px solid #ddd}
</style>
</helmet>
<div class="wf">
  <div class="top"><div class="logo"></div><span style="font-size: 20px; font-weight: 700;">Proyecto Aurora</span><span style="margin-left: auto; font-size: 16px;">Usuario · Rol</span><span class="tab">Salir</span></div>
  <div class="nav"><a class="tab" href="Inicio.dc.html">Inicio</a><a class="tab on" href="Cola.dc.html">Cola</a><a class="tab" href="Casos.dc.html">Casos</a><a class="tab" href="Imagenes.dc.html">Imágenes</a><a class="tab" href="Dashboard.dc.html">Dashboard</a><a class="tab" href="Parametros.dc.html">Parámetros</a></div>
  <div class="body">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; flex-direction: column; gap: 6px;"><p style="margin: 0; font-size: 28px; font-weight: 700;">Cola de triage</p><div class="ln" style="width: 360px;"></div></div>
      <button type="button" class="btn">↻ Actualizar</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
      <div class="box" style="border-width: 2px 2px 2px 8px;"><span style="font-size: 30px; font-weight: 700;">#</span><span style="font-size: 16px;">Prioridad ALTA</span></div>
      <div class="box" style="border-width: 2px 2px 2px 5px;"><span style="font-size: 30px; font-weight: 700;">#</span><span style="font-size: 16px;">Prioridad MEDIA</span></div>
      <div class="box"><span style="font-size: 30px; font-weight: 700;">#</span><span style="font-size: 16px;">Prioridad BAJA</span></div>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; font-size: 16px;"><input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #333;"> Incluir casos en revisión</label>
    <div style="border: 2px solid #333; border-radius: 8px; overflow: hidden;">
      <div class="tr" style="border-top: 0; font-weight: 700; font-size: 15px; background: #eee;"><span>#</span><span>Código</span><span>Nivel</span><span>Estado</span><span>Espera</span><span>Puntaje</span><span>Paciente</span><span></span></div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div class="tr">
          <span style="font-size: 15px;">{{r.n}}</span>
          <div class="ln" style="width: 80%;"></div>
          <span><span class="chip">{{r.lvl}}</span></span>
          <div class="ln" style="width: 60%;"></div>
          <div class="ln" style="width: 40%;"></div>
          <div class="ln" style="width: 40%;"></div>
          <div class="ln" style="width: 70%;"></div>
          <a href="Casos.dc.html" style="font-size: 15px; text-decoration: underline;">Abrir</a>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
  const rows = ['ALTA', 'ALTA', 'MEDIA', 'MEDIA', 'MEDIA', 'BAJA'].map((lvl, i) => ({ n: i + 1, lvl }));
  return { rows };
}
}
</script>
</body>
</html>
