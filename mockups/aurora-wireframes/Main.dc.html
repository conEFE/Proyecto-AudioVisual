<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Wireframe · Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#333}a:hover{color:#000}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #fafaf7; color: #333; font-family: Kalam, cursive; display: flex;">
  <div style="flex: 1; display: flex; align-items: center; justify-content: center;">
    <div style="width: 400px; border: 2px solid #333; border-radius: 10px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div style="width: 48px; height: 48px; border: 2px solid #333; border-radius: 8px;"></div>
        <p style="margin: 0; font-size: 28px; font-weight: 700;">Bienvenido</p>
        <div style="width: 220px; height: 10px; background: #ccc; border-radius: 5px;"></div>
      </div>
      <label for="w-rut" style="font-size: 18px;">RUT</label>
      <input id="w-rut" style="height: 38px; border: 2px solid #333; border-radius: 6px; background: transparent;">
      <label for="w-pass" style="font-size: 18px;">Contraseña</label>
      <input id="w-pass" type="password" style="height: 38px; border: 2px solid #333; border-radius: 6px; background: transparent;">
      <a href="Inicio.dc.html" style="display: flex; align-items: center; justify-content: center; height: 46px; margin-top: 8px; background: #333; color: #fafaf7; border-radius: 6px; font-size: 20px; text-decoration: none;">Iniciar sesión</a>
      <div style="width: 70%; height: 10px; background: #ccc; border-radius: 5px; align-self: center;"></div>
    </div>
  </div>
  <div style="flex: 1; border-left: 2px dashed #999; display: flex; flex-direction: column; justify-content: center; padding: 64px; gap: 14px;">
    <p style="margin: 0; font-size: 32px; font-weight: 700;">Detección temprana de cáncer de mama</p>
    <div style="width: 90%; height: 12px; background: #ccc; border-radius: 6px;"></div>
    <div style="width: 75%; height: 12px; background: #ccc; border-radius: 6px;"></div>
    <div style="width: 60%; height: 12px; background: #ccc; border-radius: 6px;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
